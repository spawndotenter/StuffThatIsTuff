<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#app{display:flex;height:100%}
#bar{flex:none;width:110px;background:#111;display:flex;flex-direction:column;gap:10px;padding:10px;box-sizing:border-box;overflow-y:auto;transition:margin-left .2s}
#bar.hidden{margin-left:-110px}
.tab{background:#1c1c1c;border:2px solid #333;border-radius:10px;padding:6px;cursor:pointer;color:#ccc;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.tab{position:relative}
.tab:hover{border-color:#777}
.wifi{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.wifi::after{content:attr(data-tip);position:absolute;top:26px;right:0;white-space:nowrap;background:#000;color:#fff;border:1px solid #666;border-radius:5px;padding:3px 7px;font-size:11px;font-style:normal;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.wifi:hover::after{opacity:1}
.tab.on{border-color:#fff;background:#2a2a2a;color:#fff}
#stage{position:relative;flex:1}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#000}
iframe.on{display:block}
#toggle,#gear,#reload{position:absolute;top:6px;z-index:10;width:28px;height:28px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;opacity:.5;font-size:16px;line-height:1;padding:0}
#toggle{left:6px}#gear{left:40px}#reload{left:74px;display:none}#reload.show{display:block}
#gear:hover,#reload:hover,#toggle.on,#gear.on{opacity:1}
#panel{position:absolute;top:40px;left:40px;z-index:11;background:#111;border:1px solid #444;border-radius:8px;padding:10px 12px;color:#ddd;font-size:13px;display:none;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#panel.open{display:flex}
#repo{color:#6cb0ff;text-decoration:none;border-top:1px solid #333;padding-top:8px}
#repo:hover{text-decoration:underline}
#panel label{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
#toggle:hover{opacity:1}
#pct{position:absolute;top:6px;right:10px;z-index:10;display:none;padding:6px 14px;border-radius:8px;border:0;background:#c0392b;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;opacity:.85}
#pct:hover{opacity:1}
#pct.show{display:block}
@media (max-width:600px){#bar{width:80px}#bar.hidden{margin-left:-80px}}
</style>
</head>

#settings{margin-top:18px;display:grid;grid-template-columns:auto 160px 2ch;gap:10px 14px;align-items:center;text-align:left;font-size:15px}
#settings input{width:100%;accent-color:var(--food)}
#settings span{text-align:right}
#settings input[type=checkbox]{width:20px;height:20px;justify-self:start;margin:0}
#title{margin:0 0 14px;font-size:46px;letter-spacing:.04em;color:var(--food);text-transform:uppercase}
#up{font-size:13px;opacity:.85}
#hs{margin-top:10px;font-size:16px;font-weight:bold}
#modes{display:flex;gap:12px;margin-bottom:14px}
.mbtn{font:inherit;font-size:16px;padding:8px 20px;border-radius:8px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.mbtn.on{background:var(--fg);color:var(--bg)}
#arcade,#attacks{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;text-align:left;width:100%;max-width:520px}
.hdr{grid-column:1/-1;font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.1em}
.ar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:6px 10px;border-radius:8px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--bg))}
.ar .an{font-size:13px;font-weight:bold}
.ar .ad{grid-column:1;font-size:11px;opacity:.7}
.ar .ctl{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:6px;font-size:15px}
.ar .ctl button{font:inherit;width:24px;height:24px;line-height:1;padding:0;border-radius:6px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.ar .ctl span{min-width:1.5ch;text-align:center}
.ar .ctl button.tg{width:48px;font-size:13px}
.ar .ctl button.tg.on{background:var(--fg);color:var(--bg)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--overlay);padding:20px;font-size:22px}
.ov.on{display:flex}
.ov .btn{margin-top:16px;font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
#cards h2{margin:0 0 20px;font-size:28px}
#cards p{margin:0 0 20px;font-size:14px;opacity:.7}
#cardrow{display:flex;gap:20px}
.card{width:220px;padding:18px 14px;border-radius:12px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--bg));color:var(--fg);font:inherit;cursor:pointer;text-align:center;transition:transform .12s}
.card:hover,.card:focus-visible{transform:translateY(-5px)}
.card .r{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);font-weight:bold}
.card .n{font-size:20px;font-weight:bold;margin:10px 0}
.card .d{font-size:14px;line-height:1.4}
.card .k{margin-top:14px;font-size:12px;opacity:.6}
#pstats{margin-top:14px;display:grid;grid-template-columns:auto auto;gap:4px 24px;font-size:16px;text-align:left}
#pstats span:nth-child(even){text-align:right;font-weight:bold}
#pups{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px}
.pu{width:220px;padding:5px 10px;border-radius:8px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--bg));font-size:14px;font-weight:bold}
.pu .pd{font-size:11px;font-weight:normal;opacity:.7}

&lt;script&gt;
(function(){

  var cols,rows,snake,dir,nextDir,foods,state,t0,tFinal,timer,m,nextAt,ex,nextEx,v,nextV,up,eaten,invulnUntil,pauseStart,cardOpts,fl=[],nextFl=0,stunUntil=0,flashUntil=0,acid=null,drops=[],acidAt=Infinity,dashReady=true,dashFire=0,dashCool=0,dashRedUntil=0,dashLeft=0,dashStart=0,dashEnd=0;
  var atk={missile:true,vmissile:true,explosion:true,flashbang:false,acid:false};

  }
  function updateUp(){
    var p=[];
    if(up.shield) p.push(&#x27;Shield x&#x27;+up.shield);
    if(up.friendly) p.push(&#x27;Friendly tail&#x27;);
    if(up.wormhole) p.push(&#x27;Wormhole&#x27;);

  function availableCards(){

      if(c.once &amp;&amp; up[c.id]) return false;

  }

  function shiftTimes(dt){

  function pauseGame(){

  function levelUp(){

  function start(d){

  function input(k){

  function die(){

    mt.textContent=&#x27;You died. Score &#x27;+pts()+&#x27;, time &#x27;+tFinal.toFixed(1)+&#x27;s&#x27;+(nh?&#x27; — new high score!&#x27;:&#x27;&#x27;);

  function tick(){
    if(state!==&#x27;playing&#x27;) return;
    if(performance.now()&lt;stunUntil) return;
    dir=nextDir;

    var ate=-1;

const $=id=&gt;document.getElementById(id);

const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];

const nm=i=&gt;&#x27;abcdefgh&#x27;[i&amp;7]+(8-(i&gt;&gt;3));

function init(){const b=Array(64).fill(null),k=&#x27;RNBQKBNR&#x27;;
  for(let c=0;c&lt;8;c++){b[c]=&#x27;b&#x27;+k[c];b[8+c]=&#x27;bP&#x27;;b[48+c]=&#x27;wP&#x27;;b[56+c]=&#x27;w&#x27;+k[c]}

const at=(b,r,c)=&gt;r&gt;=0&amp;&amp;r&lt;8&amp;&amp;c&gt;=0&amp;&amp;c&lt;8?b[r*8+c]:undefined;

function atk(b,sq,by){const r=sq&gt;&gt;3,c=sq&amp;7,pr=by==&#x27;w&#x27;?r+1:r-1;

    let y=r+dr,x=c+dc,p;while((p=at(b,y,x))===null){y+=dr;x+=dc}

function pseudo(s,i){const b=s.b,p=b[i],col=p[0],t=p[1],r=i&gt;&gt;3,c=i&amp;7,en=col==&#x27;w&#x27;?&#x27;b&#x27;:&#x27;w&#x27;,out=[];

    const pm=(to,x={})=&gt;add(to,r+d==last?{...x,pr:1}:x);

function apply(s,m,pr=&#x27;Q&#x27;){

const kingSq=(b,col)=&gt;b.indexOf(col+&#x27;K&#x27;);

function insufficient(s){const o=s.b.filter(p=&gt;p&amp;&amp;p[1]!=&#x27;K&#x27;);
  return o.length==0||(o.length==1&amp;&amp;(o[0][1]==&#x27;N&#x27;||o[0][1]==&#x27;B&#x27;))}

  if(m.ca)o=(m.t&amp;7)==6?&#x27;O-O&#x27;:&#x27;O-O-O&#x27;;
  else{const cap=s.b[m.t]||m.ep;
    if(t==&#x27;P&#x27;){if(cap)o+=&#x27;abcdefgh&#x27;[m.f&amp;7]}
    else{o=t;const al=allLegal(s).filter(x=&gt;x.f!=m.f&amp;&amp;x.t==m.t&amp;&amp;s.b[x.f]==p);

        o+=sf?(sr?nm(m.f):8-(m.f&gt;&gt;3)):&#x27;abcdefgh&#x27;[m.f&amp;7]}}
    if(cap)o+=&#x27;x&#x27;;o+=nm(m.t);if(m.pr)o+=&#x27;=&#x27;+pr}
  if(inCheck(n))o+=allLegal(n).length?&#x27;+&#x27;:&#x27;#&#x27;;return o}

/* simple computer opponent: 3-ply alpha-beta on material + position */
function ev(s){let v=0;
  for(let i=0;i&lt;64;i++){const p=s.b[i];if(!p)continue;const r=i&gt;&gt;3,c=i&amp;7,w=p[0]==&#x27;w&#x27;;
    let x=V[p[1]];

  ms.sort((x,y)=&gt;(s.b[y.t]?1:0)-(s.b[x.t]?1:0));
  for(const m of ms){const sc=-nega(apply(s,m),d-1,-b,-a);if(sc&gt;=b)return b;if(sc&gt;a)a=sc}

  for(const m of ms){const sc=-nega(apply(s,m),2,-Infinity,Infinity)+Math.random()*6;
    if(sc&gt;bs){bs=sc;best=[m]}}

/* ---------- UI state ---------- */
let S=init(),hist=[],sel=null,targets=[],flip=false,over=false,msg=&#x27;&#x27;,timer=null,pending=null;

function status(){const ms=allLegal(S),chk=inCheck(S),w=S.turn==&#x27;w&#x27;;over=false;
  if(!ms.length){over=true;msg=chk?(w?&#x27;Black&#x27;:&#x27;White&#x27;)+&#x27; wins by checkmate.&#x27;:&#x27;Draw by stalemate.&#x27;}
  else if(insufficient(S)){over=true;msg=&#x27;Draw: not enough material to mate.&#x27;}
