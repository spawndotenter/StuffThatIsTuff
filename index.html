<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#ffffff;--line:#d6d6d2;--accent:#e5322d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#f0f0f0;--card:#222;--line:#3a3a3a;--accent:#ff4d47}}
:root[data-theme="dark"]{--bg:#161616;--fg:#f0f0f0;--card:#222;--line:#3a3a3a;--accent:#ff4d47}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
main{max-width:1500px;margin:0 auto;padding:40px 20px;text-align:center}
h1{margin:0 0 8px;font-size:34px;letter-spacing:.04em;text-transform:uppercase}
p{margin:0 0 32px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--accent)}
.pic{height:260px;display:flex;align-items:center;justify-content:center;background:#000}
.pic img{max-width:100%;max-height:100%;display:block}
.name{padding:14px;font-size:20px;font-weight:bold}
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:10}
#viewer.on{display:block}
#viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#back{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:11;font:14px ui-monospace,Menlo,Consolas,monospace;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;opacity:.85}
#back:hover{opacity:1}
.dlt{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85}
.dlt.pop{right:44px}
.dlt:hover,.dlt:focus-visible{opacity:1;background:var(--accent)}
#pct{right:105px!important}
#gear{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));z-index:12;width:28px;height:28px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;opacity:.6;font-size:16px;line-height:1;padding:0}
#gear{left:6px}
#gear.gone{display:none}
#gear:hover,#gear.on{opacity:1}
#panel{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));left:6px;z-index:13;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;display:none;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:left}
#panel.open{display:flex}
#panel label{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
#dl{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
#dl:hover{border-color:var(--accent)}
#repo{color:#6cb0ff;text-decoration:none;border-top:1px solid var(--line);padding-top:8px}
#repo:hover{text-decoration:underline}
.pic{position:relative}
.off{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-style:normal;font:12px ui-monospace,Menlo,Consolas,monospace}
#pct{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:100px;z-index:11;display:none;font:14px ui-monospace,Menlo,Consolas,monospace;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;opacity:.85}
#pct.show{display:block}
#pct:hover{opacity:1}
</style>
</head>

.04em;color:var(--food);text-transform:uppercase}\n#up{font-size:13px;opacity:.85}\n#hs{margin-top:10px;font-size:16px;font-weight:bold}\n#modes{display:flex;gap:12px;margin-bottom:14px}\n.mbtn{font:inherit;font-size:16px;padding:8px 20px;border-radius:8px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}\n.mbtn.on{background:var(--fg);color:var(--bg)}\n#arcade,#attacks{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;text-align:left;width:100%;max-width:520px}\n.hdr{grid-column:1/-1;font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.1em}\n.ar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:6px 10px;border-radius:8px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--bg))}\n.ar .an{font-size:13px;font-weight:bold}\n.ar .ad{grid-column:1;font-size:11px;opacity:.7}\n.ar .ctl{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:6px;font-size:15px}\n.ar .ctl button{font:inherit;width:24px;height:24px;line-height:1;padding:0;border-radius:6px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}\n.ar .ctl span{min-width:1.5ch;text-align:center}\n.ar .ctl button.tg{width:48px;font-size:13px}\n.ar .ctl button.tg.on{background:var(--fg);color:var(--bg)}\n.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--overlay);padding:20px;font-size:22px}\n.ov.on{display:flex}\n.ov .btn{margin-top:16px;font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}\n#cards h2{margin:0 0 20px;font-size:28px}\n#cards p{margin:0 0 20px;font-size:14px;opacity:.7}\n#cardrow{display:flex;gap:20px}\n.card{width:220px;padding:18px 14px;border-radius:12px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--bg));color:var(--fg);font:inherit;cursor:pointer;text-align:center;transition:transform .12s}\n.card:hover,.card:focus-visible{transform:translateY(-5px)}\n.card .r{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);font-weight:bold}\n.card .n{font-size:20px;font-weight:bold;margin:10px 0}\n.card .d{font-size:14px;line-height:1.4}\n.card .k{margin-top:14px;font-size:12px;opacity:.6}\n#pstats{margin-top:14px;display:grid;grid-template-columns:auto auto;gap:4px 24px;font-size:16px;text-align:left}\n#pstats span:nth-child(even){text-align:right;font-weight:bold}\n#pups{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px}\n.pu{width:220px;padding:5px 10px;border-radius:8px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--bg));font-size:14px;font-weight:bold}\n.pu .pd{font-size:11px;font-weight:normal;opacity:.7}\n<\/style>\n<\/head>\n<body>\n<div id=\"game\">\n<div id=\"hud\"><div>Score: <span id=\"s\">0<\/span><\/div><div>Time: <span id=\"t\">0.0<\/span>s<\/div><span id=\"up\" class=\"hide\"><\/span><\/div>\n<div id=\"wrap\">\n  <canvas id=\"c\"><\/canvas>\n  <div id=\"msg\"><h1 id=\"title\">Evil Snake<\/h1>\n    <div id=\"modes\"><button class=\"mbtn on\" id=\"mcamp\">Campaign<\/button><button class=\"mbtn\" id=\"marc\">Arcade<\/button><\/div>\n    <div id=\"mt\">Press W, A, S or D to start<\/div><small id=\"ms\">Swipe on touch screens. Avoid the edges and the missiles.<\/small>\n    <div id=\"hs\"><\/div>\n    <div id=\"arcade\" class=\"hide\"><\/div>\n    <div id=\"attacks\" class=\"hide\"><\/div>\n    <div id=\"settings\" class=\"hide\">\n      <label for=\"fr\">Apples<\/label><input id=\"fr\" type=\"range\" min=\"1\" max=\"30\" value=\"5\"><span id=\"frv\">5<\/span>\n      <label for=\"sp\">Speed<\/label><input id=\"sp\" type=\"range\" min=\"1\" max=\"10\" value=\"7\"><span id=\"spv\">7<\/span>\n          <\/div>\n  <\/div>\n  <div id=\"pause\" class=\"ov\"><div>Paused<\/div><div style=\"font-size:15px;opacity:.7;margin-top:10px\">Press Esc to resume, M for main menu<\/div>\n    <div id=\"pstats\"><\/div><div id=\"pups\"><\/div>\n    <div style=\"display:flex;gap:12px\"><button class=\"btn\" id=\"resume\">Resume<\/button><button class=\"btn\" id=\"tomenu\">Main menu<\/button><\/div><\/div>\n  <div id=\"cards\" class=\"ov\"><h2>Level up!<\/h2><div id=\"cardrow\"><\/div><button class=\"btn\" id=\"skip\">Skip (Esc)<\/button><\/div>\n<\/div>\n<\/div>\n<script>\n(function(){\n  var SIZE=24, FOODS=5, STEP=100;\n  var cv=document.getElementById('c'), ctx=cv.getContext('2d');\n  var sEl=document.getElementById('s'), tEl=document.getElementById('t'), upEl=document.getElementById('up');\n  var pauseEl=document.getElementById('pause'), cardsEl=document.getElementById('cards'), rowEl=document.getElementById('cardrow');\n  var gameEl=document.getElementById('game'), wrapEl=document.getElementById('wrap');\n  var msg=document.getElementById('msg'), mt=document.getElementById('mt'), ms=document.getElementById('ms');\n  var arcEl=document.getElementById('arcade'), atkEl=document.getElementById('attacks'), mcamp=document.getElementById('mcamp'), marc=document.getElementById('marc');\n  var cols,rows,snake,dir,nextDir,foods,state,t0,tFinal,timer,m,nextAt,ex,nextEx,v,nextV,up,eaten,invulnUntil,pauseStart,cardOpts,fl=[],nextFl=0,stunUntil=0,flashUntil=0,acid=null,drops=[],acidAt=Infinity,dashReady=true,dashFire=0,dashCool=0,dashRedUntil=0,dashLeft=0,dashStart=0,dashEnd=0,bo=null,nextBo=0;\n  var atk={missile:true,vmissile:true,explosion:true,flashbang:false,acid:false,blackout:false};\n  var mode='campaign', score=0, level=1, lvlApples=0, hi={campaign:0,arcade:0};\n  var DIRS={w:[0,-1],a:[-1,0],s:[0,1],d:[1,0]};\n  var RC={Common:'#9ca3af',Uncommon:'#22c55e',Epic:'#a855f7',Legendary:'#facc15',Arcade:'#ef4444'};\n  var CARDS=[\n    {id:'friendly',name:'Friendly tail',desc:'Your tail no longer kills you',rating:'Legendary',once:true},\n    {id:'apples',name:'More Apples',desc:'Gain +2 apples',rating:'Common'},\n    {id:'digest',name:'Slow Digestion',desc:'Your tail grows 3x less',rating:'Uncommon',once:true},\n    {id:'shoes',name:'Fast Shoes',desc:'Gain +2 Speed',rating:'Common',once:true},\n    {id:'shield',name:'Shield',desc:'Prevent 1 hit of Damage',rating:'Legendary'},\n    {id:'dash',name:'Dash',desc:'Press Spacebar to dash!',rating:'Epic',once:true},\n    {id:'wormhole',name:'Wormhole',desc:'Instead of the walls killing you, they teleport you to the opposite side',rating:'Uncommon',once:true},\n    {id:'borders',name:'Bigger Borders',desc:'Increase the game border by 50x50 Pixels on each side!',rating:'Uncommon',max:2},\n    {id:'faster',name:'Faster Stages',desc:'Decrease the amount of apples needed to goto the next level by 2',rating:'Uncommon'},\n    {id:'limdigest',name:'Limited Digestion',desc:'Only grow up to 3 length',rating:'Arcade',arcadeOnly:true}\n  ];\n  // Arcade starting-upgrade options: max count and a short blurb\n  var AR=[\n    {id:'shield',max:5,blurb:'Blocks 1 hit each'},\n    {id:'friendly',max:1,blurb:'Tail never kills you'},\n    {id:'limdigest',max:1,blurb:'Only grow up to 3 length'},\n    {id:'wormhole',max:1,blurb:'Walls wrap around'},\n    {id:'dash',max:1,blurb:'Spacebar to dash'},\n    {id:'borders',max:2,blurb:'+50px border on each side'}\n  ];\n  function newUp(){return {friendly:0,apples:0,digest:0,shoes:0,shield:0,wormhole:0,dash:0,borders:0,faster:0,limdigest:0};}\n  function center(){ return {x:Math.floor(cols/2),y:Math.floor(rows/2)}; }\n  function applySize(){\n    cols=Math.floor((648+100*up.borders)/SIZE); rows=Math.floor((552+100*up.borders)/SIZE);\n    var W=cols*SIZE, H=rows*SIZE;\n    wrapEl.style.width=W+'px'; wrapEl.style.height=H+'px'; gameEl.style.width=(W+4)+'px';\n    cv.width=W; cv.height=H; fit();\n  }\n  var arc=newUp();\n  up=newUp(); eaten=0; invulnUntil=0;\n  function pts(){ return Math.floor(score+1e-6); }\n  function mult(){ return mode==='campaign' ? 1+0.15*(level-1) : 1; }\n  function need(){ return Math.max(1,20+5*(level-1)-2*up.faster); }\n  function loadHi(){\n    try{ hi.campaign=+localStorage.getItem('evilsnake_hi_campaign')||0; hi.arcade=+localStorage.getItem('evilsnake_hi_arcade')||0; }catch(e){}\n  }\n  function saveHi(){\n    var s=pts();\n    if(s>hi[mode]){ hi[mode]=s; try{ localStorage.setItem('evilsnake_hi_'+mode,String(s)); }catch(e){} return true; }\n    return false;\n  }\n  function showHi(){ document.getElementById('hs').textContent='High score ('+(mode==='arcade'?'Arcade':'Campaign')+'): '+hi[mode]; }\n  function cardById(id){ for(var i=0;i<CARDS.length;i++) if(CARDS[i].id===id) return CARDS[i]; }\n  function baseSpd(){ return mode==='arcade'?+sp.value:7; }\n  function recalc(){\n    var lvl=Math.min(11,baseSpd()+2*up.shoes);\n    FOODS=(mode==='arcade'?+fr.value:5)+2*up.apples;\n    STEP=Math.round(210-lvl*16);\n  }\n  function updateUp(){\n    var p=[];\n    if(up.shield) p.push('Shield x'+up.shield);\n    if(up.friendly) p.push('Friendly tail');\n    if(up.wormhole) p.push('Wormhole');\n    if(up.digest) p.push('Slow Digestion');\n    if(up.apples) p.push('Apples +'+2*up.apples);\n    if(up.shoes) p.push('Speed +'+2*up.shoes);\n    if(up.borders) p.push('Bigger Borders x'+up.borders);\n    if(up.faster) p.push('Faster Stages x'+up.faster);\n    if(up.limdigest) p.push('Limited Digestion');\n    upEl.textContent=p.join(' \\u00b7 ');\n  }\n  function availableCards(){\n    return CARDS.filter(function(c){\n      if(c.arcadeOnly) return false;\n      if(c.once && up[c.id]) return false;\n      if(c.max && up[c.id]>=c.max) return false;\n      if(c.id==='friendly' && !up.digest) return false;\n      if(c.id==='shoes' && baseSpd()+2*up.shoes>=11) return false;\n      return true;\n    });\n  }\n  function harm(){\n    var now=performance.now();\n    if(now<invulnUntil) return false;\n    if(up.shield>0){ up.shield--; invulnUntil=now+1500; updateUp(); return false; }\n    die(); return true;\n  }\n  function shiftTimes(dt){\n    t0+=dt; nextAt+=dt; nextEx+=dt; nextV+=dt; nextFl+=dt; nextBo+=dt; if(bo) bo.end+=dt; invulnUntil+=dt;\n    if(stunUntil) stunUntil+=dt;\n    if(flashUntil) flashUntil+=dt;\n    fl.forEach(function(e){ e.t+=dt; e.boom+=dt; });\n    acidAt+=dt;\n    if(dashFire) dashFire+=dt;\n    dashStart+=dt;\n    if(dashEnd) dashEnd+=dt;\n    dashCool+=dt;\n    if(dashRedUntil) dashRedUntil+=dt;\n    if(acid){ acid.warn+=dt; acid.down+=dt; acid.in+=dt; acid.out+=dt; acid.gone+=dt; acid.nextDrop+=dt; }\n    drops.forEach(function(d){ d.t+=dt; });\n    if(m){ m.warn+=dt; m.fly+=dt; }\n    if(v){ v.warn+=dt; v.fly+=dt; }\n    ex.forEach(function(e){ e.t+=dt; e.boom+=dt; });\n  }\n  function fillPause(){\n    var rowsData=[['Mode',mode==='arcade'?'Arcade':'Campaign'],['Score',pts()],['High score',Math.max(hi[mode],pts())],['Time',((pauseStart-t0)/1000).toFixed(1)+'s'],['Length',snake.length]];\n    if(mode==='campaign'){ rowsData.push(['Level',level]); rowsData.push(['Multiplier','x'+mult().toFixed(2)]); rowsData.push(['Apples this level',lvlApples+' / '+need()]); }\n    var ps=document.getElementById('pstats'); ps.innerHTML='';\n    rowsData.forEach(function(r){\n      var a=document.createElement('span'); a.textContent=r[0];\n      var b=document.createElement('span'); b.textContent=r[1];\n      ps.appendChild(a); ps.appendChild(b);\n    });\n    var pu=document.getElementById('pups'); pu.innerHTML='';\n    CARDS.forEach(function(c){\n      var n=up[c.id]; if(!n) return;\n      var d=document.createElement('div'); d.className='pu'; d.style.setProperty('--rc',RC[c.rating]);\n      var label=c.name;\n      if(c.id==='shield'||c.id==='borders'||c.id==='faster') label+=' x'+n; else if(c.id==='apples'||c.id==='shoes') label+=' +'+2*n;\n      var nm=document.createElement('div'); nm.textContent=label;\n      var ds=document.createElement('div'); ds.className='pd'; ds.textContent=c.desc;\n      d.appendChild(nm); d.appendChild(ds); pu.appendChild(d);\n    });\n    if(!pu.children.length){ pu.textContent='No upgrades yet'; pu.style.opacity='.7'; pu.style.fontSize='14px'; }\n    else { pu.style.opacity=''; pu.style.fontSize=''; }\n  }\n  function pauseGame(){\n    if(state!=='playing') return;\n    state='paused'; pauseStart=performance.now(); fillPause(); pauseEl.classList.add('on');\n  }\n  function resumeGame(){\n    if(state!=='paused') return;\n    shiftTimes(performance.now()-pauseStart); state='playing'; pauseEl.classList.remove('on');\n  }\n  function toMenu(){\n    if(state!=='paused') return;\n    saveHi();\n    pauseEl.classList.remove('on');\n    reset();\n  }\n  function levelUp(){\n    snake=[center()]; bo=null; m=null; v=null; ex=[]; fl=[]; stunUntil=0; flashUntil=0; acid=null; drops=[]; acidAt=Infinity; dashFire=0; dashRedUntil=0; dashLeft=0; dashEnd=0;\n    foods.forEach(function(f,i){ if(f.x===snake[0].x&&f.y===snake[0].y) foods[i]=spawn(); });\n    level++; lvlApples=0; state='cards'; pauseStart=performance.now();\n    cardOpts=availableCards().sort(function(){return Math.random()-0.5;}).slice(0,2);\n    rowEl.innerHTML='';\n    cardOpts.forEach(function(c,i){\n      var b=document.createElement('button');\n      b.className='card'; b.style.setProperty('--rc',RC[c.rating]);\n      [['r',c.rating],['n',c.name],['d',c.desc],['k','Press '+['Q','E'][i]]].forEach(function(p){\n        var d=document.createElement('div'); d.className=p[0]; d.textContent=p[1]; b.appendChild(d);\n      });\n      b.addEventListener('click',function(){ choose(c); });\n      rowEl.appendChild(b);\n    });\n    cardsEl.classList.add('on'); draw();\n  }\n  function skipCard(){\n    if(state!=='cards') return;\n    cardsEl.classList.remove('on');\n    shiftTimes(performance.now()-pauseStart); state='playing';\n    acidAt=performance.now()+7000+Math.random()*7000;\n  }\n  function choose(c){\n    if(state!=='cards') return;\n    up[c.id]++;\n    if(c.id==='borders'){ applySize(); snake=[center()]; foods=[]; for(var q=0;q<FOODS;q++) foods.push(spawn()); }\n    if(c.id==='apples'){ recalc(); foods.push(spawn()); foods.push(spawn()); }\n    if(c.id==='shoes'){ recalc(); clearInterval(timer); timer=setInterval(tick,STEP); }\n    updateUp(); cardsEl.classList.remove('on');\n    shiftTimes(performance.now()-pauseStart); state='playing';\n    acidAt=performance.now()+7000+Math.random()*7000;\n    if(c.id==='dash'){ dashReady=true; dashFire=0; dashRedUntil=performance.now()+750; }\n  }\n\n  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}\n  function occupied(x,y){\n    for(var i=0;i<snake.length;i++) if(snake[i].x===x&&snake[i].y===y) return true;\n    for(var j=0;j<foods.length;j++) if(foods[j].x===x&&foods[j].y===y) return true;\n    return false;\n  }\n  function spawn(){\n    for(var n=0;n<500;n++){\n      var x=Math.floor(Math.random()*cols), y=Math.floor(Math.random()*rows);\n      if(!occupied(x,y)) return {x:x,y:y};\n    }\n    return {x:0,y:0};\n  }\n  function reset(){\n    up=newUp();\n    if(mode==='arcade'){ for(var k in arc) up[k]=arc[k]; }\n    applySize();\n    snake=[center()];\n    dir=null; nextDir=null; foods=[]; state='ready'; t0=0; tFinal=0; bo=null; m=null; v=null; ex=[]; fl=[]; stunUntil=0; flashUntil=0; acid=null; drops=[]; acidAt=Infinity; dashReady=true; dashFire=0; dashCool=0; dashRedUntil=0; dashLeft=0; dashEnd=0;\n    recalc(); eaten=0; invulnUntil=0; updateUp();\n    pauseEl.classList.remove('on'); cardsEl.classList.remove('on');\n    for(var i=0;i<FOODS;i++) foods.push(spawn());\n    score=0; level=1; lvlApples=0; sEl.textContent='0'; tEl.textContent='0.0'; showHi();\n    mt.textContent='Press W, A, S or D to start';\n    ms.textContent=mode==='arcade'\n      ? 'Endless mode. Choose your starting upgrades below.'\n      : 'Swipe on touch screens. Avoid the edges and the missiles.';\n    msg.classList.remove('hide');\n    clearInterval(timer); timer=setInterval(tick,STEP);\n    draw();\n  }\n  function start(d){\n    state='playing'; t0=performance.now(); nextDir=d; dir=d; nextAt=t0+3000+Math.random()*1000; nextEx=t0+3000+Math.random()*2000; nextV=t0+5000+Math.random()*1000; nextFl=t0+11000+Math.random()*4000; nextBo=t0+10000; acidAt=t0+7000+Math.random()*7000; if(up.dash){ dashReady=true; dashFire=0; dashRedUntil=t0+750; }\n    msg.classList.add('hide');\n  }\n  function input(k){\n    var d=DIRS[k]; if(!d) return;\n    if(state==='dead'){ reset(); }\n    if(state==='ready'){ start(d); return; }\n    if(state==='playing'){\n      if(snake.length>1 && dir && d[0]===-dir[0] && d[1]===-dir[1]) return;\n      nextDir=d;\n    }\n  }\n  function die(){\n    state='dead'; bo=null; m=null; v=null; ex=[]; fl=[]; stunUntil=0; flashUntil=0; acid=null; drops=[]; acidAt=Infinity; dashFire=0; dashRedUntil=0; dashLeft=0; dashEnd=0; tFinal=(performance.now()-t0)/1000;\n    tEl.textContent=tFinal.toFixed(1);\n    var nh=saveHi(); showHi();\n    mt.textContent='You died. Score '+pts()+', time '+tFinal.toFixed(1)+'s'+(nh?' — new high score!':'');\n    ms.textContent='Press W, A, S or D to play again';\n    msg.classList.remove('hide');\n  }\n  function tick(){\n    if(state!=='playing') return;\n    if(performance.now()<stunUntil) return;\n    dir=nextDir;\n    var h=snake[0], nx=h.x+dir[0], ny=h.y+dir[1];\n    if(nx<0||ny<0||nx>=cols||ny>=rows){\n      if(up.wormhole){ nx=(nx+cols)%cols; ny=(ny+rows)%rows; }\n      else { harm(); draw(); return; }\n    }\n    var ate=-1;\n    for(var i=0;i<foods.length;i++) if(foods[i].x===nx&&foods[i].y===ny) ate=i;\n    if(!up.friendly){\n      var body=ate>=0?snake.length:snake.length-1;\n      for(var j=0;j<body;j++) if(snake[j].x===nx&&snake[j].y===ny){ if(harm()){ draw(); return; } break; }\n    }\n    snake.unshift({x:nx,y:ny});\n    if(ate>=0){\n      foods.splice(ate,1); foods.push(spawn()); eaten++; lvlApples++; score+=mult();\n      if(up.digest && eaten%3!==0) snake.pop();\n      if(up.limdigest && snake.length>3) snake.pop();\n    } else snake.pop();\n    sEl.textContent=pts();\n    if(mode==='campaign' && lvlApples>=need()){ levelUp(); return; }\n    draw();\n  }\n  function draw(){\n    ctx.clearRect(0,0,cv.width,cv.height);\n    ctx.fillStyle=css('--food');\n    foods.forEach(function(f){ctx.fillRect(f.x*SIZE+1,f.y*SIZE+1,SIZE-2,SIZE-2);});\n    var redNow=performance.now()<dashRedUntil && Math.floor(performance.now()/100)%2===0;\n    var orangeNow=performance.now()<dashEnd;\n    ctx.fillStyle=orangeNow?'#f97316':css(redNow?'--food':'--me');\n    snake.forEach(function(p,i){\n      ctx.globalAlpha=i===0?((performance.now()<invulnUntil&&Math.floor(performance.now()/100)%2)?0.3:1):0.75;\n      ctx.fillRect(p.x*SIZE+1,p.y*SIZE+1,SIZE-2,SIZE-2);\n    });\n    ctx.globalAlpha=1;\n    if(m) drawMissile();\n    if(v) drawVMissile();\n    drawExplosions();\n    drawAcid();\n    drawFlashbangs();\n    drawShield();\n    drawBlackout();\n    drawFlash();\n  }\n  function shieldPath(cx,cy,w,h){\n    var top=cy-h/2, bot=cy+h/2;\n    ctx.beginPath();\n    ctx.moveTo(cx,top);\n    ctx.lineTo(cx+w/2,top+h*0.16);\n    ctx.lineTo(cx+w/2,top+h*0.5);\n    ctx.quadraticCurveTo(cx+w/2,top+h*0.86,cx,bot);\n    ctx.quadraticCurveTo(cx-w/2,top+h*0.86,cx-w/2,top+h*0.5);\n    ctx.lineTo(cx-w/2,top+h*0.16);\n    ctx.closePath();\n  }\n  function drawShield(){\n    if(!up.shield||!snake||!snake.length) return;\n    var hd=snake[0], cx=hd.x*SIZE+SIZE/2, cy=hd.y*SIZE+SIZE/2, w=SIZE*1.5, h=SIZE*1.8;\n    ctx.save();\n    ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=2;\n    shieldPath(cx,cy,w,h); ctx.fill(); ctx.stroke();\n    ctx.lineWidth=1.5; shieldPath(cx,cy+1,w*0.6,h*0.62); ctx.stroke();\n    if(up.shield>1){\n      var label='x'+up.shield, tx=cx+w/2+4, ty=cy-h/2+2;\n      ctx.globalAlpha=0.9; ctx.font='bold 13px ui-monospace,Menlo,Consolas,monospace';\n      ctx.textAlign='right'; ctx.textBaseline='top';\n      ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.strokeText(label,tx,ty);\n      ctx.fillStyle='#000'; ctx.fillText(label,t }

  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function gameName(g){var t=document.querySelector('.tile[data-g="'+g+'"] .name');return t?t.textContent:g}
function downloadGame(g){
  var name=gameName(g), html;
  if(U.indexOf(g)>=0){
    html='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+name.replace(/</g,'&lt;')+'</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe src="'+G[g]+'" allowfullscreen allow="fullscreen; autoplay; gamepad"></iframe></body></html>';
  } else html=G[g];
  saveBlob(new Blob([html],{type:'text/html'}),name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.html');
}
function popGame(g){
  var w=window.open('about:blank','_blank'); if(!w)return;
  var d=w.document; d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+(optC.checked?'Home - Classroom':'Untitled')+'</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body></body></html>');
  d.close();
  var n=d.createElement('iframe');
  n.setAttribute('allowfullscreen','');
  n.setAttribute('allow','fullscreen; autoplay; gamepad');
  n.setAttribute(U.indexOf(g)>=0?'src':'srcdoc',G[g]);
  d.body.appendChild(n);
}
document.querySelectorAll('.tile').forEach(function(b){
  b.addEventListener('click',function(){openGame(b.dataset.g)});
  function wire(el,fn){
    el.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();fn(b.dataset.g)});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.stopPropagation();e.preventDefault();fn(b.dataset.g)}});
  }
  wire(b.querySelector('.dlt:not(.pop)'),downloadGame);
  wire(b.querySelector('.pop'),popGame);
});
document.getElementById('pct').onclick=function(){
  var b=atob(SAVE),u=new Uint8Array(b.length);for(var k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
  saveBlob(new Blob([u],{type:'application/zip'}),'isaac-file1.zip');
};
document.getElementById('back').addEventListener('click',function(){
  viewer.classList.remove('on'); cur=null; document.getElementById('pct').classList.remove('show'); frame.removeAttribute('srcdoc'); frame.src='about:blank'; setReload();
});
gear.onclick=function(e){e.stopPropagation();panel.classList.toggle('open');this.classList.toggle('on',panel.classList.contains('open'))};
panel.onclick=function(e){e.stopPropagation()};
document.addEventListener('click',function(){panel.classList.remove('open');gear.classList.remove('on')});
var dl=document.getElementById('dl'),DL_LABEL=dl.innerHTML;
dl.onclick=function(){
  dl.innerHTML='Downloading&hellip;';dl.disabled=true;
  function sv(t){saveBlob(new Blob([t],{type:'text/html'}),'game_hub.html')}
  fetch('https://raw.githubusercontent.com/spawndotenter/StuffThatIsTuff/main/index.html?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
    .then(sv,function(){sv(ORIG)})
    .then(function(){dl.innerHTML=DL_LABEL;dl.disabled=false});
};
var optC=document.getElementById('optClass'), iconEl=document.querySelector('link[rel="icon"]'), ORIG_TITLE=document.title, ORIG_ICON=iconEl?iconEl.getAttribute('href'):'';
var CLASS_ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="#0f9d58"/><rect x="10" y="14" width="44" height="32" rx="3" fill="#fff"/><rect x="10" y="46" width="44" height="6" fill="#f4b400"/><circle cx="32" cy="26" r="6" fill="#0f9d58"/><path d="M20 42c0-7 5-10 12-10s12 3 12 10z" fill="#0f9d58"/></svg>');
function applyHeader(){
  document.title=optC.checked?'Home - Classroom':ORIG_TITLE;
  if(!iconEl){iconEl=document.createElement('link');iconEl.rel='icon';document.head.appendChild(iconEl)}
  iconEl.removeAttribute('type');
  iconEl.setAttribute('href',optC.checked?CLASS_ICON:ORIG_ICON);
}
function saveOpts(){try{localStorage.setItem('menuOpts2',JSON.stringify({h:optH.checked,c:optC.checked}))}catch(e){}}
optH.onchange=function(){saveOpts();setReload()};
optC.onchange=function(){saveOpts();applyHeader()};
try{var o=JSON.parse(localStorage.getItem('menuOpts2')||'{}');optH.checked=(o.h===undefined)?true:!!o.h;optC.checked=!!o.c}catch(e){optH.checked=true}
applyHeader();
</script>
